# ================================================
# /etc/nginx/sites-available/progitresor.online
# Nginx Reverse Proxy — ProgiTresor
# Domaine : progitresor.online | IP VPS : 180.149.199.203
#
# Installation:
#   sudo cp nginx.progitresor.conf /etc/nginx/sites-available/progitresor.online
#   sudo ln -s /etc/nginx/sites-available/progitresor.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ================================================

# ------------------------------------------------
# FRONTEND — progitresor.online + www
# ------------------------------------------------
server {
    listen 80;
    server_name progitresor.online www.progitresor.online;

    # Augmenter pour les uploads fichiers CSV/Excel
    client_max_body_size 50M;

    # Logs dédiés
    access_log /var/log/nginx/progitresor.access.log;
    error_log  /var/log/nginx/progitresor.error.log;

    location / {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR en dev, Server Actions)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# ------------------------------------------------
# API GATEWAY — api.progitresor.online
# ------------------------------------------------
server {
    listen 80;
    server_name api.progitresor.online;

    client_max_body_size 50M;

    access_log /var/log/nginx/progitresor-api.access.log;
    error_log  /var/log/nginx/progitresor-api.error.log;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# ------------------------------------------------
# STORAGE MINIO — storage.progitresor.online
# ------------------------------------------------
server {
    listen 80;
    server_name storage.progitresor.online;

    client_max_body_size 100M;

    access_log /var/log/nginx/progitresor-storage.access.log;
    error_log  /var/log/nginx/progitresor-storage.error.log;

    # MinIO Console Web UI (port 9001)
    location / {
        proxy_pass         http://127.0.0.1:9001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO S3 API (port 9000) pour téléchargement direct de fichiers / PDF
    location /s3/ {
        proxy_pass         http://127.0.0.1:9000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Désactiver le buffering pour gros fichiers
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
