# ================================================
# /etc/nginx/sites-available/progitpaie.online
# Nginx Reverse Proxy — ProgiTresor
# Domaine : progitpaie.online | IP VPS : 180.149.199.203
#
# Installation:
#   sudo cp nginx.progitpaie.conf /etc/nginx/sites-available/progitpaie.online
#   sudo ln -s /etc/nginx/sites-available/progitpaie.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ================================================

# ------------------------------------------------
# FRONTEND — progitpaie.online + www
# ------------------------------------------------
server {
    listen 80;
    server_name progitpaie.online www.progitpaie.online;

    # Augmenter pour les uploads fichiers Excel
    client_max_body_size 50M;

    # Logs dédiés
    access_log /var/log/nginx/progitpaie.access.log;
    error_log  /var/log/nginx/progitpaie.error.log;

    location / {
        proxy_pass         http://127.0.0.1:3030;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR en dev, Server Actions)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# ------------------------------------------------
# API GATEWAY — api.progitpaie.online
# ------------------------------------------------
server {
    listen 80;
    server_name api.progitpaie.online;

    client_max_body_size 50M;

    access_log /var/log/nginx/progitpaie-api.access.log;
    error_log  /var/log/nginx/progitpaie-api.error.log;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;

        # Préflight CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'https://progitpaie.online';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
            add_header 'Access-Control-Max-Age'       1728000;
            add_header 'Content-Length'               0;
            return 204;
        }
    }
}

# ------------------------------------------------
# MINIO CONSOLE — storage.progitpaie.online
# (Accès admin uniquement — à protéger en prod)
# ------------------------------------------------
server {
    listen 80;
    server_name storage.progitpaie.online;

    access_log /var/log/nginx/progitpaie-storage.access.log;
    error_log  /var/log/nginx/progitpaie-storage.error.log;

    location / {
        proxy_pass         http://127.0.0.1:9001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}

